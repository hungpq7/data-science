name: deploy-book

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Jupyter Book v2 (MyST engine)
        run: |
          python -m pip install -U pip
          pip install -U jupyter-book

      # If your book lives in a subfolder, set working-directory: book
      - name: Build the site (no execution)
        run: |
          jupyter-book build .
          # In JB v2/MyST, notebooks are NOT executed unless you pass --execute. :contentReference[oaicite:6]{index=6}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
