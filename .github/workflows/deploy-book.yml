# .github/workflows/deploy-book.yml
name: deploy-book

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Jupyter Book v2
        run: |
          python -m pip install -U pip
          pip install "jupyter-book>=2.0.0a0"   # <- v2 line

      # If your book is NOT at repo root, add:
      # working-directory: ./path/to/book
      - name: Build the site (no execution)
        run: |
          jupyter book build .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
