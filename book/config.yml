title: Data Science
author: Quang Hung &#9829; Thuy Linh
logo: book/image/logo.svg
only_build_toc_files: true
exclude_patterns: [
  '_build',
  '.DS_Store',
  '**.ipynb_checkpoints',
  'README.md',
  'Thumbs.db',
]

execute:
  execute_notebooks: off

repository:
  url: https://github.com/hungpq7/data-science
  branch: main

html:
  favicon: book/image/favicon.ico
  use_issues_button: true
  use_repository_button: true
  use_download_button: true
  # extra_css: book/custom.css

sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    html_static_path: book/static
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
      - url_new_tab.js
    html_css_files:
      - ui_tweak.css
    html_theme_options:
      show_navbar_depth: 1

launch_buttons:
  notebook_interface: jupyterlab # classic
  binderhub_url: https://mybinder.org
  jupyterhub_url: ""
  deepnote_url: https://deepnote.com
  colab_url: https://colab.research.google.com
  thebe: true

parse:
  myst_substitutions:
      sub3: My _global_ value!
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution